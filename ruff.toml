# Ruff configuration for github-branch-protection-checker
# https://docs.astral.sh/ruff/

# Python version target
target-version = "py38"

# Line length
line-length = 100

[lint]
# Enable recommended rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults
    "UP007",  # Use X | Y for type annotations (not compatible with Python 3.8)
    "SIM117", # Use a single with statement (requires Python 3.9+ for parenthesized form)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[lint.per-file-ignores]
# Ignore imports in __init__.py files
"__init__.py" = ["F401", "F403"]
# Test files can have additional flexibility
"tests/**/*.py" = ["N802", "N806"]  # Allow non-lowercase function names in tests

[lint.isort]
known-first-party = ["github_branch_protection_checker"]

[format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Use Unix line endings
line-ending = "lf"
