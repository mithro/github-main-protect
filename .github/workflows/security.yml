name: Security Scanning

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Run security scans weekly on Monday at 9am UTC
    - cron: '0 9 * * 1'

jobs:
  gitleaks:
    name: GitLeaks Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches and tags

      - name: Download GitLeaks
        run: |
          wget -q https://github.com/zricethezav/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run GitLeaks on repository
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Scanning changed files in PR only"
            gitleaks detect --no-git --source . -v
          else
            echo "Scanning full repository history"
            gitleaks detect -v
          fi

  safety-check:
    name: Python Dependency Safety Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install safety
        run: uv pip install --system safety

      - name: Export requirements
        run: uv pip freeze --system > requirements.txt

      - name: Run safety check
        run: uv run safety check --file requirements.txt --output text
        continue-on-error: true  # Don't fail on vulnerabilities, just report them

  bandit:
    name: Bandit Security Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install bandit
        run: uv pip install --system bandit[toml]

      - name: Run bandit security scan
        run: uv run bandit -r github_branch_protection_checker/ -f json -o bandit-report.json
        continue-on-error: true

      - name: Display bandit results
        run: uv run bandit -r github_branch_protection_checker/ -f screen
        continue-on-error: true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
